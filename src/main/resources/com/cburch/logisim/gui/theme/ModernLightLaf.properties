# Libadwaita Light Theme for Logisim-Evolution
@baseTheme = light

# GNOME / Libadwaita Colors
@adwBlue = #3584e4
@adwBlueHover = #1c71d8
@adwBlueActive = #165dbe
@adwDestructive = #e01b24
@adwSuccess = #2ec27e
@adwWarning = #e5a50a

# Surfaces & Controls
@background = #fafafa
@foreground = #2e3436
@cardBackground = #ffffff
@componentBackground = #ffffff
@buttonBackground = #f6f6f6
@buttonBorder = #dedede
@menuBackground = #ffffff
@menuForeground = #2e3436
@borderColor = #dedede

# Accents & Selection
@accentColor = @adwBlue
@accentBaseColor = @adwBlue
@accentBase2Color = @adwBlueHover
@selectionBackground = @adwBlue
@selectionForeground = #ffffff
@selectionInactiveBackground = #e2e8f0
@selectionInactiveForeground = #2e3436
@menuSelectionBackground = @adwBlue
@menuSelectionForeground = #ffffff

# Component Geometry (Libadwaita rounded design)
Component.arc = 8
Component.focusWidth = 2
Component.focusColor = @adwBlue
Component.innerFocusWidth = 0
Component.borderColor = @borderColor

# Buttons
Button.arc = 8
Button.background = @buttonBackground
Button.default.background = @adwBlue
Button.default.foreground = #ffffff
Button.default.hoverBackground = @adwBlueHover
Button.default.pressedBackground = @adwBlueActive
Button.default.boldText = true
Button.margin = 5,12,5,12

# Text Inputs
TextComponent.arc = 8
TextField.margin = 5,8,5,8
PasswordField.margin = 5,8,5,8
ComboBox.arc = 8
ComboBox.borderCornerRadius = 8

# ScrollBar (Modern GNOME / Libadwaita pill style)
ScrollBar.thumbArc = 999
ScrollBar.showButtons = false
ScrollBar.width = 10
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollBar.thumb = #c0c0c0
ScrollBar.hoverThumbColor = #9a9a9a

# Sliders & Progress
ProgressBar.arc = 999
Slider.trackValueColor = @adwBlue

# TabbedPane (Clean Adwaita tabs)
TabbedPane.tabArc = 8
TabbedPane.selectedBackground = #ffffff
TabbedPane.underlineColor = @adwBlue
TabbedPane.underlineHeight = 3
TabbedPane.showTabSeparators = false

# SplitPane
SplitPane.dividerSize = 6
SplitPaneDivider.gripDotCount = 0

# Window / HeaderBar styling
TitlePane.useWindowDecorations = true
TitlePane.unifiedBackground = true
TitlePane.centerTitle = true
TitlePane.showIcon = false
TitlePane.background = #ebebeb
TitlePane.foreground = #2e3436
TitlePane.buttonArc = 999
TitlePane.buttonSize = 34,34
TitlePane.closeHoverBackground = @adwDestructive
TitlePane.closePressedBackground = darken(@adwDestructive,10%)
TitlePane.closeHoverForeground = #ffffff

# Lists and Trees
Tree.selectionBackground = @adwBlue
Tree.selectionForeground = #ffffff
List.selectionBackground = @adwBlue
List.selectionForeground = #ffffff
Table.selectionBackground = @adwBlue
Table.selectionForeground = #ffffff
